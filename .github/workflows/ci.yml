name: CI

# Lane went red? See ../../docs/ci-troubleshooting.md for a per-job runbook (what each
# lane runs, what a red usually means, what to check first) lifted from this file's own
# inline comments — read that first before re-deriving a diagnosis from scratch here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs: a new push supersedes the previous run. `main`: never cancel (#1865). A cancelled main
  # run never reaches its SwiftPM cache save, and main's caches are the only ones a PR can
  # restore (a cache written on refs/pull/N/merge is invisible to every other PR) — with merges
  # landing minutes apart, 7 of 15 consecutive main runs were cancelled and `gh cache list`
  # showed zero caches on main, so every lane on every PR started cold. GitHub already keeps at
  # most one running + one pending run per group, so back-to-back merges still collapse to
  # "current + latest" rather than piling up.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Drop AnglesiteContainer (and its native apple/containerization graph) from every SwiftPM/xcodebuild
# manifest evaluation in CI. `swift build`/`swift test` compile all products, so without this CI's
# macOS runners would try to build the Swift-6.2/native container stack they can neither build nor
# run. No CI lane builds the container runtime yet; a future app-build lane (#69 Task 8) that needs
# it can override this at the job level. Mechanism: Package.swift gates target+product+dependency on
# this var.
env:
  ANGLESITE_SKIP_CONTAINER: '1'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      js: ${{ steps.filter.outputs.js }}
      wysiwyg: ${{ steps.filter.outputs.wysiwyg }}
      safariExt: ${{ steps.filter.outputs.safariExt }}
      template: ${{ steps.filter.outputs.template }}
      helpBook: ${{ steps.filter.outputs.helpBook }}
      workers: ${{ steps.filter.outputs.workers }}
      docsIndex: ${{ steps.filter.outputs.docsIndex }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. We diff push events against `github.event.before`, the tip of `main`
          # before the push — which can be more than one commit back (this repo allows
          # merge-commit and rebase-merge, and has no branch protection stopping a direct
          # multi-commit push), so a shallow `before`-sized depth can undershoot and fail the
          # diff. The repo is ~9MB/474 commits, so a full clone here is still fast — cheap
          # insurance against a job that gates every other job in this workflow.
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        # Inline replacement for a third-party path-filter action: the org's Actions policy
        # only allows GitHub-owned/Verified-Creator actions, and dorny/paths-filter (an
        # individual's action, not an org) doesn't qualify — every run failed at startup with
        # no job ever dispatched. This reproduces the same four filter groups with plain git
        # + bash so the gating job has no external-action dependency at all.
        #
        # `.github/workflows/ci.yml` is in every group: a change to this file should never
        # cause a job to go unevaluated just because we're the ones who touched the filters.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
            # First push of a new branch (or a force-push) reports an all-zero `before` — fall
            # back to the parent commit, and to the empty tree if there isn't one (initial
            # commit), which conservatively treats every tracked file as changed.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
              base=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
            fi
          fi

          echo "Diffing against: $base"
          declare -a changed=()
          mapfile -t changed < <(git diff --name-only "$base" HEAD)
          printf '  changed: %s\n' "${changed[@]}"

          matches() {
            local f pattern
            for f in "${changed[@]}"; do
              for pattern in "$@"; do
                case "$f" in
                  $pattern) return 0 ;;
                esac
              done
            done
            return 1
          }

          swift=false; js=false; wysiwyg=false; safariExt=false; template=false; helpBook=false; workers=false; docsIndex=false
          matches 'Package.swift' 'Package.resolved' 'project.yml' 'Sources/**' 'Tests/**' 'Resources/Template/**' 'Resources/Attributions/**' 'scripts/**' 'packaging/flatpak/**' '.github/workflows/ci.yml' && swift=true
          matches 'JS/edit-overlay/**' 'scripts/node-version.txt' '.github/workflows/ci.yml' && js=true
          matches 'JS/wysiwyg-engine/**' 'scripts/node-version.txt' '.github/workflows/ci.yml' && wysiwyg=true
          matches 'JS/safari-extension/**' 'scripts/node-version.txt' '.github/workflows/ci.yml' && safariExt=true
          matches 'Resources/Template/**' 'scripts/node-version.txt' 'scripts/generate-npm-attributions.mjs' 'scripts/attributions-overrides.json' '.github/workflows/ci.yml' && template=true
          matches 'Resources/Anglesite.help/**' 'scripts/check-help-links.sh' '.github/workflows/ci.yml' && helpBook=true
          matches 'Workers/**' 'scripts/node-version.txt' '.github/workflows/ci.yml' && workers=true
          matches 'docs/specs/**' 'docs/superpowers/**' 'scripts/generate-docs-index.py' 'scripts/test-generate-docs-index.py' '.github/workflows/ci.yml' && docsIndex=true

          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "wysiwyg=$wysiwyg" >> "$GITHUB_OUTPUT"
          echo "safariExt=$safariExt" >> "$GITHUB_OUTPUT"
          echo "template=$template" >> "$GITHUB_OUTPUT"
          echo "helpBook=$helpBook" >> "$GITHUB_OUTPUT"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"
          echo "docsIndex=$docsIndex" >> "$GITHUB_OUTPUT"

  edit-overlay:
    name: JS edit-overlay (lint/typecheck/test)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: JS/edit-overlay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Track the vendored runtime (scripts/vendor-node.sh) so CI tests on the
          # same Node major the app ships.
          node-version-file: scripts/node-version.txt
          cache: npm
          cache-dependency-path: JS/edit-overlay/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  safari-extension:
    name: JS safari-extension (lint/typecheck/test)
    needs: changes
    if: needs.changes.outputs.safariExt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: JS/safari-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: scripts/node-version.txt
          cache: npm
          cache-dependency-path: JS/safari-extension/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  wysiwyg-engine:
    name: JS wysiwyg-engine (lint/typecheck/test/e2e)
    needs: changes
    if: needs.changes.outputs.wysiwyg == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: JS/wysiwyg-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: scripts/node-version.txt
          cache: npm
          cache-dependency-path: JS/wysiwyg-engine/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  template-worker:
    name: Template (build/test)
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Resources/Template
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: scripts/node-version.txt
          cache: npm
          cache-dependency-path: Resources/Template/package-lock.json
      - run: npm ci --no-audit --no-fund
      # scaffold.sh, build-packs.sh, and scaffold.test.ts run zsh (#1179);
      # ubuntu-latest doesn't ship it.
      - run: sudo apt-get update && sudo apt-get install -y zsh

      # scripts/generate-npm-attributions.mjs lives at the repo root, not under
      # Resources/Template, so it needs its own node:test invocation outside this job's
      # working-directory default — this `template` filter already triggers on changes to
      # that file (see the `changes` job), and setup-node above already put the right Node
      # on PATH, so this is the natural lane for it (#1797).
      - name: Test generate-npm-attributions.mjs
        working-directory: ${{ github.workspace }}
        run: node --test scripts/generate-npm-attributions.test.mjs

      # The website-template attributions manifest check lives in build-test (macos-26), not
      # here (ubuntu-latest) — see that job's "Check website-template attributions manifest"
      # step for why: the committed manifest is arm64-only and can never match a linux-x64
      # npm ci install.
      # The template's node:test suites had no CI lane at all — the `.well-known` design doc
      # calls that out explicitly. `test:worker` is vitest/workerd only. `npm test` covers every
      # node:test suite (scripts/ plus src/); `test:scripts` stays in package.json as the fast
      # scripts-only subset for local iteration, but running it here too would be redundant.
      - run: npm test
      - run: npm run test:worker
      - run: npm run build
      # Port-contract lint + per-pack chassis builds (#1179). Both are fast no-ops
      # until packs/ gains entries; once ports land, a pack that violates the
      # contract or breaks astro build fails this lane.
      - run: npm run check:packs
      - run: npm run build:packs

  workers-tests:
    name: Workers (vitest)
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cloudflare Worker projects under Workers/ each carry their own Vitest suite (plain
    # vitest importing the worker module — this repo's Workers-testing convention). Until
    # #1368 nothing ran them in CI, so e.g. the oauth-callback Worker's "never reflects the
    # OAuth code" guarantee only held when someone remembered to run the tests by hand.
    strategy:
      fail-fast: false
      matrix:
        project: [ControlWorker, anglesite-oauth-callback]
    defaults:
      run:
        working-directory: Workers/${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: scripts/node-version.txt
          cache: npm
          cache-dependency-path: Workers/${{ matrix.project }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  help-book-links:
    name: Help Book links
    needs: changes
    if: needs.changes.outputs.helpBook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Split out of edit-overlay: a Help Book-only change shouldn't pay for a full npm
    # install/lint/typecheck/test cycle just to reach this check. Plain bash+grep, no deps.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Help Book links
        run: scripts/check-help-links.sh

  docs-index:
    name: Docs index (specs/plans README + Status header)
    needs: changes
    if: needs.changes.outputs.docsIndex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # docs/specs/README.md and docs/superpowers/README.md are generated from the design
    # docs' header lines (#1816). Same shape as help-book-links: stdlib python3 only, no
    # installs. Fails when a README is stale or a doc dated on/after the convention start
    # has no recognised `Status:` line; warns (non-fatal) when CLAUDE.md & co. point at a
    # superseded spec.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generator unit tests
        run: python3 scripts/test-generate-docs-index.py
      - name: Check docs indexes are current
        run: scripts/generate-docs-index.py --check

  linux-build-test:
    name: Linux (portable SwiftPM targets)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cross-platform port, phase 1 "purity" (2026-07-08 design §9/§10): the compiler is the
    # purity lint. Off-Darwin, Package.swift exposes only the targets that compile there —
    # AnglesiteSiteModel and AnglesiteCore today; each seam PR that purifies more of the
    # portable set expands that list until `swift build && swift test` covers the whole
    # portable core. The official Swift image pins the toolchain (and ships the right
    # libxml2), so this lane is immune to runner-image drift.
    container:
      image: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain versions
        run: swift --version

      # Keyed on the swift:6.3.3-noble image (a different image tag would need a different
      # cache) + Package.resolved (dependency changes shouldn't reuse a stale checkout) +
      # commit SHA (so every run saves fresh; restore-keys below fall back to the closest
      # match instead of requiring an exact one). SwiftPM's own incremental build tracking
      # handles the rest — a partial-match restore never produces wrong output, only a
      # partially-warm cache.
      #
      # The `v2` segment isn't a real version bump — it exists to stop restoring caches
      # written before the Anglesite-app → Anglesite repo rename. Those caches' precompiled
      # .pcm module files embed the old `/__w/Anglesite-app/Anglesite-app/...` workspace
      # path, and SwiftPM refuses to reuse a module cache whose baked-in path doesn't match
      # the current one ("missing required module 'SwiftShims'"). Bump again if this ever
      # recurs after another workspace-path change.
      #
      # Restore here, save only from `main` at the end of the job (#1865) — this split applies
      # to every SwiftPM cache in this workflow. The one-step `actions/cache` form saved a fresh
      # sha-suffixed cache (~1GB per macOS lane) from every PR push; against the repo's 10GB
      # cache cap that evicted everything within a few pushes (measured: 10.78GB in use, every
      # entry on a refs/pull/*/merge ref, none on main), so the macOS lanes logged "Cache not
      # found" even on a PR's second push. Now only `main` writes — its per-SHA set fits the cap
      # with room for the previous one — and every PR restores from it through the prefix
      # restore-keys; SwiftPM's incremental tracking then rebuilds just what the PR changed.
      # PRs also stop paying the 30-50s post-job upload. The save step passes the restore
      # step's `cache-primary-key` output rather than recomputing the key: `swift build` under
      # ANGLESITE_SKIP_CONTAINER=1 rewrites Package.resolved on disk, so a fresh
      # hashFiles('Package.resolved') at the end of the job would no longer match.
      - name: Restore SwiftPM build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-linux-6.3.3-noble-v2-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-linux-6.3.3-noble-v2-${{ hashFiles('Package.resolved') }}-
            swiftpm-linux-6.3.3-noble-v2-

      - name: Build (debug)
        run: swift build -c debug

      - name: Test
        run: swift test -c debug --parallel

      - name: Test install-swift-linux.sh retry/backoff loop
        run: scripts/install-swift-linux.test.sh

      # Pure-bash unit test, no Apple `container` CLI/podman needed — cheap to run here even
      # though stage-dev-image-context.sh backs the macOS/podman image-vendoring scripts.
      - name: Test stage-dev-image-context.sh sidecar version guard
        run: scripts/lib/stage-dev-image-context.test.sh

      # Stubs `swift` on PATH and uses a throwaway lock dir, so it never touches the real
      # /tmp/anglesite-swift-test.lock or compiles anything (#1594). No model contention here
      # (this lane never calls the live-model suites), but the lock/retry logic under test is
      # exercised entirely through the stub, so CI coverage doesn't need real contention.
      - name: Test swift-test.sh lock/retry logic
        run: scripts/swift-test.test.sh

      # Stubs `gh`, `lsof`, and `plutil` and runs against a throwaway git repo, so every
      # safety branch (merged/dirty/busy/orphaned worktrees, live/dead DerivedData) is
      # exercised without touching this machine's real worktrees or DerivedData (#1461).
      - name: Test prune-worktrees.sh safety rails
        run: scripts/prune-worktrees.test.sh

      # No docker/network dependency — runs against throwaway container/ fixtures, so
      # the CANONICAL_IMAGE_DIGEST -> Dockerfile.cloudflare rewrite (#1644) is checked
      # without touching this repo's real files.
      - name: Test pin-cloudflare-canonical-image.sh digest rewrite
        run: scripts/pin-cloudflare-canonical-image.test.sh

      - name: Save SwiftPM build cache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  linux-flatpak-build:
    name: Linux (Flatpak manifest + AnglesiteLinux)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # continue-on-error: adwaita-swift's own dependencies (Meta and friends) float on branch
    # `main` and cannot be frozen from this repo — SwiftPM rejects a root-level revision pin
    # of a package another dependency requires by branch, and Package.resolved is gitignored —
    # so an upstream push can break this lane with no change here. Not hypothetical: #1385 was
    # exactly that (Meta's main dropped WidgetData.stateManager out from under every
    # adwaita-swift revision, then restored it days later; the pin bump that closed #1385 rode
    # the restoration). Non-blocking so upstream drift can't wedge unrelated PRs —
    # AnglesiteLinux stays behind the ANGLESITE_LINUX_SHELL=1 opt-in gate regardless, so this
    # doesn't affect what ships. If this lane fails on your PR, check whether the failure is
    # in .build/checkouts (upstream drift — file an issue like #1385) before suspecting your
    # own change.
    continue-on-error: true
    # Builds packaging/flatpak/io.dwk.anglesite.linux.yml for real and runs AnglesiteLinuxTests
    # inside the same GNOME-SDK sandbox — the CI lane
    # docs/superpowers/specs/2026-08-06-flatpak-packaging-investigation.md §8/§9 and Package.swift's
    # own comment on the ANGLESITE_LINUX_SHELL=1 gate both named as the blocker for un-gating
    # AnglesiteLinux from that opt-in. `linux-build-test` above can't cover this: its
    # swift:6.3.3-noble image lacks libadwaita ≥ 1.7 / webkitgtk-6.0, which only a GNOME-Platform
    # Flatpak SDK (or an equivalent system install) carries. Live-verified end-to-end on a real
    # Ubuntu 26.04/aarch64 GTK box for #1293: the manifest builds, the app boots a real podman
    # container through `flatpak-spawn --host` (no conmon hang), the document-portal bind-mount
    # resolves correctly, the overlay JS loads, and a long-lived `podman exec -i` interactive
    # session's stdio survives the same `flatpak-spawn --host` proxy — this job exercises the
    # first two of those (build + AnglesiteLinuxTests); the rest need a live GTK/podman
    # environment this headless runner doesn't have and stay manually verified.
    #
    # Does NOT run AnglesiteCoreTests (so PodmanContainerControlTests and
    # DocumentPortalResolutionTests don't execute here either) — that target isn't in
    # Package.swift's off-Darwin `portableTargets` set yet (confirmed live: it also pulls in
    # AnglesiteTestSupport, itself not purity-swept), tracked separately in #1284. Only
    # AnglesiteLinuxTests (ShellModel's pure overlay-candidate logic) is Linux-portable today.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: scripts/node-version.txt
      - name: Build edit overlay
        run: scripts/build-overlay.sh

      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dbus-user-session

      - name: Add flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      # ~3GB (org.gnome.Platform/Sdk + the swift6 SDK extension) — by far the slowest part of a
      # cold run. Keyed on the manifest itself so a runtime-version/branch bump (the pins below,
      # and packaging/flatpak/io.dwk.anglesite.linux.yml's own runtime-version/sdk-extensions)
      # invalidates the cache instead of silently reusing stale runtimes.
      - name: Cache Flatpak runtimes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtimes-gnome50-swift6-25.08-${{ hashFiles('packaging/flatpak/io.dwk.anglesite.linux.yml') }}

      # `flatpak install --noninteractive` still prompts (and fails outright, non-interactively)
      # when a ref has more than one matching branch on the remote — verified live against
      # org.freedesktop.Sdk.Extension.swift6, which resolves to both //24.08 and //25.08 on
      # Flathub. The branch must be pinned explicitly; org.gnome.Sdk//50 is itself built against
      # freedesktop runtime 25.08 (confirmed live via its Mesa/codecs-extra extension branches),
      # so that's the one to pin here.
      - name: Install GNOME Platform/Sdk + Swift 6 SDK extension
        run: |
          dbus-run-session -- flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.swift6//25.08

      - name: Build the Flatpak manifest
        run: |
          dbus-run-session -- flatpak-builder --user --install --force-clean \
            packaging/flatpak/build-dir packaging/flatpak/io.dwk.anglesite.linux.yml

      # `--build-shell` accepts piped stdin non-interactively (verified live) — the only way to
      # run `swift test` with the SDK extension's toolchain on PATH, since `flatpak run` against
      # the *installed* app only mounts the GNOME runtime, not the build-time SDK extension.
      - name: Run AnglesiteLinuxTests inside the build sandbox
        run: |
          dbus-run-session -- flatpak-builder --build-shell=anglesite-linux \
            packaging/flatpak/build-dir packaging/flatpak/io.dwk.anglesite.linux.yml <<'SHELL_EOF'
          set -e
          ANGLESITE_LINUX_SHELL=1 swift test --filter AnglesiteLinuxTests
          exit
          SHELL_EOF

  build-test:
    # macos-26, not macos-15: the macos-15 image's OS libswift_Concurrency (Swift 6.2.3-era,
    # no assertions) carries a task-allocator bug (swiftlang/swift#86204 class) that crashed
    # PR #644's test run 5/5 with "freed pointer was not the last allocation" — the trigger is
    # an allocation pattern in the compiled binary, not any specific test, so any PR can trip
    # it. macOS 26.4's runtime (Swift 6.3+) has the fix; verified by running #644's exact head
    # green on macos-26 (PR #646) while it failed 5/5 on macos-15.
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    # Bumped from 15: the debug build + full test suite + release build now routinely runs
    # 13-14m on its own, leaving no margin for the post-job SwiftPM cache save — several PRs
    # (including an unrelated one on the same day as #966) hit "exceeded the maximum execution
    # time of 15m0s" mid cache-save even though every actual build/test step had already
    # succeeded. 20m restored headroom without masking a genuine hang; 25 after #1865 folded
    # the timing-sensitive suites and the DocC check in here (~2 min on a warm build, versus
    # two more macOS runner slots — see those steps).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pure `git grep` over Tests/*.swift, no Xcode/build needed — runs first so a violation
      # fails in seconds instead of after the ~13-14m build+test steps below (#1810).
      - name: Check no unjustified Task.sleep/usleep in tests
        run: scripts/check-test-sleep-marker.sh

      # The end-to-end tests spawn the real plugin's MCP server, so CI needs the sibling repo
      # present and `npm ci`-installed. Without these, the Swift Testing suites gated with
      # `.enabled(if:)` traits skip cleanly (ANGLESITE_PLUGIN_PATH absent); with them, the full
      # overlay → patcher → file-on-disk round-trip is exercised.
      - name: Checkout sibling Anglesite plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The sidecar repo was renamed Anglesite/anglesite -> Anglesite/anglesite-skills.
          # `Anglesite/anglesite` now resolves (case-insensitively) back to *this* app repo
          # (renamed Anglesite-app -> Anglesite), so it silently checks out the wrong repo
          # and then fails fetching a tag that only exists in the real sidecar.
          repository: Anglesite/anglesite-skills
          # Pinned to the sidecar release the app currently exercises. v1.9.0 carries
          # the MCP 2026-07-28 stateless spec (sidecar #432) that this e2e lane's
          # MCPClientHTTPEndToEndTests needs — the app's HTTPTransport/MCPClient stopped
          # sending `initialize` in this same PR (#1277), which a pre-v1.9.0 (sessionful)
          # server rejects with 400. Bump this pin again the next time a newer sidecar
          # feature becomes load-bearing for CI.
          ref: v1.9.0
          path: anglesite-plugin

      - name: Set up Node (for plugin MCP server tests)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Track the vendored runtime (scripts/vendor-node.sh) so the e2e tests spawn
          # the plugin's MCP server on the same Node the app embeds.
          node-version-file: scripts/node-version.txt

      # --omit=dev matches container/Dockerfile's sidecar install and the committed
      # container-image.json manifest (regenerated prod-only, see Resources/Attributions/) —
      # the e2e tests below only ever spawn server/index.mjs directly, never the sidecar's own
      # `npm test`, so its devDependencies are never needed here either.
      - name: Install plugin dependencies
        working-directory: anglesite-plugin
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Check container-image attributions manifest
        env:
          ANGLESITE_SIDECAR_SRC: ${{ github.workspace }}/anglesite-plugin
        run: |
          set -euo pipefail
          node scripts/generate-npm-attributions.mjs "$ANGLESITE_SIDECAR_SRC/node_modules" /tmp/container-image.json scripts/attributions-overrides.json
          diff -u Resources/Attributions/container-image.json /tmp/container-image.json

      # Committed Resources/Attributions/website-template.json was generated on macOS-arm64
      # (npm ci pulls darwin-arm64-only optional native packages, e.g. @esbuild/darwin-arm64),
      # so this check must run on the same platform — hence build-test (macos-26), not
      # template-worker (ubuntu-latest), where npm ci would resolve linux-x64 packages instead
      # and the manifest could never match.
      - name: Install website-template dependencies
        working-directory: Resources/Template
        run: npm ci --no-audit --no-fund

      - name: Check website-template attributions manifest
        run: |
          set -euo pipefail
          node scripts/generate-npm-attributions.mjs Resources/Template/node_modules /tmp/website-template.json scripts/attributions-overrides.json
          diff -u Resources/Attributions/website-template.json /tmp/website-template.json

      - name: Select latest available Xcode
        # CLAUDE.md mandates Xcode 27+ (macOS 27 SDK — LongRunningIntent / CancellableIntent /
        # SwiftUI 27 @State macro semantics). The previous hardcoded Xcode 16 worked only
        # because `swift build` didn't compile the macOS-27-API code path (it was in the app
        # target). #104 moves the App Intents into a SwiftPM library and surfaces the gap.
        # Pick the newest Xcode pre-installed on the runner; the runner image determines what's
        # available (macos-15 typically ships Xcode 16/26 betas).
        id: xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app 2>/dev/null | sort -V
          # Skip Xcode 26.3 on the current runner image: its toolchain builds test targets that
          # link /usr/lib/swift/libswift_DarwinFoundation3.dylib, which the image does not ship, so
          # `swift test` fails to load AnglesitePackageTests.xctest ("Library not loaded"). Prefer the
          # newest *working* Xcode — 26.3 is excluded, so 27 is still auto-selected once it lands.
          # Remove the grep once the 26.3 image is repaired (or Xcode 27 is available).
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | grep -vE '/Xcode_26\.3(\.app|\.[0-9]+\.app)$' | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST"
          # Cache-key input: a runner-image bump that changes which Xcode is "latest" must not
          # reuse a build cache from a different toolchain.
          echo "version=$(basename "$LATEST")" >> "$GITHUB_OUTPUT"
          # The DocC step for AnglesiteAppCore/AnglesiteP2P below is ARMED but skips gracefully
          # until the runner ships Xcode 27 (see that step).
          MAJOR=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "${MAJOR:-0}" -ge 27 ]; then
            echo "has27=true" >> "$GITHUB_OUTPUT"
          else
            echo "has27=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AnglesiteAppCore docs skipped::Needs Xcode 27+, runner has ${MAJOR:-unknown}. The AnglesiteAppCore/AnglesiteP2P DocC step auto-activates once a runner provides Xcode 27."
          fi

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version
          node --version

      # See the linux-build-test cache step for the key-scheme rationale, including the `v2`
      # segment that stops restoring pre-repo-rename caches and the restore-on-PR /
      # save-on-main split. Namespaced by the selected Xcode build so a runner-image toolchain
      # bump can't restore incompatible object files.
      - name: Restore SwiftPM build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-macos-v2-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-macos-v2-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved') }}-
            swiftpm-macos-v2-${{ steps.xcode.outputs.version }}-

      - name: Build (debug)
        run: swift build -c debug

      - name: Check app-binary attributions manifest
        # This job builds under the workflow-level ANGLESITE_SKIP_CONTAINER=1 (line 23), which
        # drops AnglesiteContainer's whole dependency graph (grpc-swift, containerization, etc.)
        # from Package.swift's manifest evaluation for speed — the preceding `swift build` step
        # re-resolves against that reduced target set, silently shrinking the working copy's
        # Package.resolved from 44 pins down to ~14 (and rewriting the file on disk to match). The
        # committed Resources/Attributions/app-binary.json must reflect the FULL app (the real
        # Xcode build, which never sets this var), so this step overrides back to '0' and restores
        # the full pin set before generating.
        #
        # Package.resolved is a tracked, committed file (not gitignored — see its own history):
        # restoring it from git is what makes this deterministic. `git checkout` puts back the
        # exact pinned revisions/versions the committed attributions manifest was generated
        # against, and `swift package resolve` then only fetches the checkouts the reduced build
        # step above didn't need — it does not upgrade any pin, because the restored lock file
        # already satisfies the full manifest's version constraints (that's the whole point of a
        # committed Package.resolved). This must NOT be `rm -f Package.resolved; swift package
        # resolve`: with no lock file at all, resolve picks whatever is newest upstream for each
        # dependency's version range at the moment CI happens to run, which drifts independently
        # of any change in this repo (confirmed: swift-service-lifecycle 2.11.0 → 2.12.0 upstream
        # broke this exact check on main with no relevant diff, 2026-08-18) — a flaky, unreviewable
        # failure with no local repro, since a contributor's own machine keeps whatever Package.resolved
        # already sits in their working copy instead of discarding it.
        env:
          ANGLESITE_SKIP_CONTAINER: '0'
        run: |
          set -euo pipefail
          git checkout -- Package.resolved
          swift package resolve
          scripts/generate-swift-attributions.sh "$PWD" /tmp/app-binary.json scripts/attributions-overrides.json
          diff -u Resources/Attributions/app-binary.json /tmp/app-binary.json

      # Captured through tee so the annotate step below can re-surface compile errors:
      # a test-target compile error otherwise scrolls ~95s of unrelated compile output
      # past it, drowns in Swift-6-language-mode warnings, and leaves only SwiftPM's
      # bare `error: fatalError` sentinel at the tail — #1335 was misdiagnosed four
      # times as a toolchain crash that way. `set -o pipefail` because the default
      # `bash -e {0}` step shell does NOT set it — without it tee's exit 0 would
      # swallow the test failure entirely.
      - name: Test
        id: swift-test
        env:
          ANGLESITE_PLUGIN_PATH: ${{ github.workspace }}/anglesite-plugin
        run: |
          set -o pipefail
          source scripts/lib/timing-sensitive-tests.sh
          swift test -c debug --parallel --skip "$TIMING_SENSITIVE_TEST_FILTER" 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      - name: Surface Swift errors (annotations + job summary)
        if: failure() && steps.swift-test.outcome == 'failure'
        run: scripts/annotate-swift-log.sh "$RUNNER_TEMP/swift-test.log" "build-test ▸ Test"

      # #1727 belt-and-suspenders: every test UserDefaults suite goes through
      # TemporaryUserDefaults, whose cleanup() must leave nothing behind once the test
      # processes have exited. Checked from a separate process on purpose — the in-suite
      # assertions cannot observe what cfprefsd does at process exit, which is the mechanism
      # that produced the original ~/Library/Preferences leak.
      # The timing-sensitive suites, in their own `swift test` process (#1344's isolation:
      # no scheduler contention from the ~4,700 other tests). They were a separate macos-26 job
      # (`timing-sensitive-tests`) until #1865 — one that spent ~250s rebuilding the package
      # this job had just built, ran its suites in under 4s, and waited up to an hour in the
      # macOS runner queue to do it. As a step here it keeps its own process, reuses this job's
      # .build, and costs seconds. Deliberately no ANGLESITE_PLUGIN_PATH: the old lane never set
      # it either, so the e2e-gated variants inside these suites stay skipped exactly as before.
      - name: Test (timing-sensitive suites, isolated process)
        id: swift-test-timing-sensitive
        run: |
          set -o pipefail
          scripts/test-timing-sensitive.sh 2>&1 | tee "$RUNNER_TEMP/swift-timing-sensitive-test.log"

      - name: Surface Swift errors (annotations + job summary)
        if: failure() && steps.swift-test-timing-sensitive.outcome == 'failure'
        run: scripts/annotate-swift-log.sh "$RUNNER_TEMP/swift-timing-sensitive-test.log" "build-test ▸ Test (timing-sensitive suites)"

      # #1727/#1745: after both test processes have exited — checked from a separate process on
      # purpose, since in-suite assertions can't observe what cfprefsd does at process exit.
      - name: Check no test UserDefaults suites leaked
        run: scripts/check-test-userdefaults-leak.sh

      # DocC comment/doc-comment health check — fails on any DocC error or warning. Was its own
      # macos-26 job (`docs-docc`) until #1865: with no cache it built the package cold for ~7
      # minutes to spend ~20 seconds extracting symbol graphs, and queued behind every other
      # macOS job first. Here it reuses this job's warm debug build (measured locally: ~50s, no
      # recompilation). No xcodegen/xcodebuild involved — this is `swift package
      # generate-documentation` over the SwiftPM library targets. The --target list is
      # deliberate and explicit, not "every target": a target-less run sweeps in every
      # dependency package too, including MarkdownEngine's own broken doc comments, which we
      # don't own; and AnglesiteLANHost (an executableTarget) fails symbol-graph extraction
      # with an unrelated tooling issue ("AnglesiteLANHost.symbolgraphs doesn't exist").
      # AnglesiteContainer/AnglesiteContainerProbe are already dropped from the manifest by the
      # workflow-level ANGLESITE_SKIP_CONTAINER=1.
      - name: Build documentation (DocC, warnings as errors)
        run: |
          swift package generate-documentation \
            --target AnglesiteSiteModel \
            --target AnglesiteQuickLookSupport \
            --target AnglesiteCore \
            --target AnglesiteBridgeCore \
            --target AnglesiteBridge \
            --target AnglesiteIOS \
            --target AnglesiteIntents \
            --target AnglesiteTestSupport \
            --warnings-as-errors

      # AnglesiteAppCore is `#if compiler(>=6.4) && canImport(Darwin)`-gated in Package.swift,
      # so on a runner whose active Xcode predates 27 the target simply doesn't exist in the
      # manifest — and `--target AnglesiteAppCore` doesn't skip gracefully then, it hard-errors
      # ("no target named …"). AnglesiteP2P rides along for an unrelated reason: it isn't
      # compiler-gated, but on Xcode 26.6 `swift-symbolgraph-extract` fails to load WebRTC's
      # binary xcframework module ("missing required module 'WebRTC'") — confirmed clean under
      # Xcode 27. So both are ARMED but skip gracefully (green, with the ::warning:: emitted by
      # the Xcode-selection step) until a runner ships Xcode 27, then auto-activate.
      - name: Build documentation for AnglesiteAppCore and AnglesiteP2P (Xcode 27+ only)
        if: steps.xcode.outputs.has27 == 'true'
        run: |
          swift package generate-documentation \
            --target AnglesiteAppCore \
            --target AnglesiteP2P \
            --warnings-as-errors

      - name: Build (release)
        run: swift build -c release

      - name: Save SwiftPM build cache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  xcode27-compile:
    name: Swift 6.4 compile check (Xcode 27 preview, non-required)
    # #855: build-test's macos-26 image tops out at Xcode 26.6 / Swift 6.3.3, so the
    # `#if compiler(>=6.4) && canImport(Darwin)`-gated targets (AnglesiteAppCore,
    # AnglesiteAppTests, AnglesiteIntentsTests) are silently absent from its package graph —
    # the coverage gap that let #853's compile error land on main undetected. GitHub's
    # hosted `xcode-27` image (public preview since 2026-07-16, actions/runner-images#14404;
    # also available as `xcode-27-xlarge`) ships Xcode 27.0 beta / Swift 6.4 as the default
    # /Applications/Xcode.app, which satisfies the gate — so this lane COMPILES those
    # targets (`swift build --build-tests`), closing the #853-class regression gap.
    #
    # COMPILE-ONLY, deliberately: the image pairs the Xcode 27 SDK with a macOS 26.x HOST,
    # and this package's .macOS("27.0") deployment target makes every macOS-27-only symbol
    # a hard dyld bind — so the built test bundles cannot be LOADED on this host, and
    # SwiftPM's test enumeration dlopens every built bundle before any --skip/--filter
    # applies. Verified live across four runs (jobs 95081077293/95085647674/95093238559/
    # 95095131839), each clearing one wall only to hit the next 27-only bind:
    # the _CoreSpotlight_FoundationModels cross-import overlay (framework absent on the
    # host), CloudKit's async overlay (CKDatabase._deleteRecord(withID:)), and finally
    # AppIntents.EntityQuery.allowedExecutionTargets — inside AnglesiteIntentsTests itself,
    # one of the very suites this lane exists for. Run coverage therefore has to wait for a
    # hosted image whose HOST OS is macOS 27, not just its SDK; flip this lane's build step
    # back to `swift test` when one exists. Until then contributors must run `swift test`
    # locally on Xcode 27 (see CONTRIBUTING.md ▸ Testing).
    #
    # NON-REQUIRED / non-blocking while the image is in preview: the runner image is marked
    # preview (possible instability, queueing while capacity balances) and its Xcode is a
    # beta build, so a red here must not block unrelated PRs. That's why this job carries
    # `continue-on-error: true` and is deliberately NOT in the `ci` aggregation job's
    # `needs` list below. Promote to required (drop `continue-on-error`, add it to `ci`'s
    # needs) once the xcode-27 image reaches GA — per the #855 owner decision (2026-08-15).
    #
    # No sibling-plugin checkout here (same as concurrency-tsan): nothing executes, and the
    # gated targets have no plugin/Node dependency.
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: xcode-27
    # Longer than build-test's 15: the gated targets add the whole Sources/AnglesiteApp
    # tree (AnglesiteAppCore) to the compile, and a preview image's cache starts cold.
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest available Xcode
        # The xcode-27 image already defaults /Applications/Xcode.app to Xcode 27.0 beta;
        # this step pins the newest install explicitly (matching every other macOS lane) and
        # emits the version for the cache key. The guard below makes the lane fail loudly —
        # instead of green-with-suites-silently-dropped — if the preview label is ever
        # repointed at an image whose newest Xcode predates 27: on a <6.4 toolchain the
        # gated targets vanish from the package graph and the compile check would "pass"
        # without them, recreating the exact gap this lane exists to close.
        id: xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app 2>/dev/null | sort -V
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST"
          MAJOR=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "${MAJOR:-0}" -lt 27 ]; then
            echo "::error title=xcode-27 lane has no Xcode 27::Selected Xcode is ${MAJOR:-unknown} (<27), so the compiler(>=6.4)-gated suites would silently drop out of the package graph. Check the xcode-27 runner image contents."
            exit 1
          fi
          echo "version=$(basename "$LATEST")" >> "$GITHUB_OUTPUT"

      - name: Show toolchain versions
        # sw_vers included deliberately: the preview image pairs Xcode 27 beta with a
        # macOS 26.x HOST (26.5.2 on first run) — the host/SDK split is what makes some
        # test bundles unloadable below, so the host version must be visible in every log.
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      # Distinct key namespace from build-test's `swiftpm-macos-...`: this lane's Swift 6.4
      # toolchain compiles a larger target set (the gated targets join the graph), so
      # sharing a cache would just churn. See linux-build-test's cache step for the general
      # key-scheme rationale and the restore-on-PR / save-on-main split.
      - name: Restore SwiftPM build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-xcode27-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-xcode27-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved') }}-
            swiftpm-xcode27-v1-${{ steps.xcode.outputs.version }}-

      # tee + pipefail + annotate step: same compile-error-burying fix as build-test's Test
      # step (#1335). `swift build --build-tests`, NOT `swift test` — see the job comment:
      # the built bundles cannot be dlopen'd on this image's macOS 26.x host, so compiling
      # them (which is what catches the #853 class of regression) is the whole job. Flip to
      # `swift test` when a hosted image pairs Xcode 27 with a macOS 27 host.
      - name: Build all targets including tests (compile check)
        id: build-tests
        run: |
          set -o pipefail
          echo "::warning title=Swift 6.4 lane is compile-only::The xcode-27 preview image's host OS ($(sw_vers -productVersion)) predates macOS 27, so the built test bundles cannot be loaded here. The compiler(>=6.4)-gated targets are compile-checked only; run 'swift test' locally on Xcode 27 for execution coverage. See CONTRIBUTING.md ▸ Testing."
          swift build --build-tests -c debug 2>&1 | tee "$RUNNER_TEMP/swift-build-tests-xcode27.log"

      - name: Surface Swift errors (annotations + job summary)
        if: failure() && steps.build-tests.outcome == 'failure'
        run: scripts/annotate-swift-log.sh "$RUNNER_TEMP/swift-build-tests-xcode27.log" "Swift 6.4 compile check (Xcode 27 preview) ▸ Build all targets including tests"

      - name: Save SwiftPM build cache (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  ios-build:
    name: Xcode project (project.yml sync, AnglesiteMobile build, AppIntents schema)
    # The one lane that needs the xcodegen-generated Anglesite.xcodeproj (every other Swift lane
    # is plain SwiftPM), so everything project-shaped lives here (#1865) — three checks that
    # were three separate macOS jobs, two of them 12-second scripts that each queued up to 100
    # minutes for a macOS runner slot on the org's 5-concurrent-macOS-jobs plan:
    #
    #   1. `scripts/check-xcodeproj-sync.sh` (was `xcodeproj-sync`, which #1827 had only just
    #      moved off macos-15 — #1795): regenerates the project and asserts every app target still compiles the
    #      full tree under its Sources/ root. project.yml drift never trips `swift build`; it
    #      only bites a contributor's `xcodebuild` with "cannot find … in scope" (#123).
    #   2. The `AnglesiteMobile` iOS Simulator build (#864): no other lane compiles an iOS app
    #      target — the sync check deliberately does NOT run a full xcodebuild, and every other
    #      xcodebuild-based lane builds only the macOS `Anglesite`/`AnglesiteIntents` schemes.
    #      Building AnglesiteMobile (Package.swift's `.iOS("27.0")` platform entry + the
    #      project.yml target, PR #886) for the iOS Simulator SDK makes an iOS-incompatible
    #      change to AnglesiteCore/AnglesiteBridge/AnglesiteIOS fail CI instead of surfacing
    #      only on a contributor's local build.
    #   3. AppIntents schema conformance (was `appintents-schema`): see that step.
    #
    # macos-26, matching build-test's rationale: the newest available Xcode carries the most
    # complete iOS 27 SDK. No SwiftPM `.build` cache here: xcodebuild resolves and builds
    # packages under DerivedData, never `.build`, so the cache this lane used to declare saved
    # nothing (it logged "Cache not found" on every run and had no cache entries to its name).
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      # Pinned so a future XcodeGen release can't silently change what the sync guard accepts.
      # Bump deliberately; keep in sync with MIN_XCODEGEN in scripts/check-xcodeproj-sync.sh.
      XCODEGEN_VERSION: 2.45.4
      # SHA-256 of the pinned release's xcodegen.zip — verified after download so a compromised
      # release (or MITM) can't substitute a different binary. Re-fetch and update on every bump.
      XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest available Xcode
        # Same toolchain rationale as build-test: CLAUDE.md mandates Xcode 27+, and this
        # target's iOS deploymentTarget (project.yml) is "27.0".
        id: xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app 2>/dev/null | sort -V
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | grep -vE '/Xcode_26\.3(\.app|\.[0-9]+\.app)$' | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST"
          echo "version=$(basename "$LATEST")" >> "$GITHUB_OUTPUT"
          # The AppIntents schema step below is ARMED but skips gracefully until the runner
          # ships Xcode 27 (see that step).
          MAJOR=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "${MAJOR:-0}" -ge 27 ]; then
            echo "has27=true" >> "$GITHUB_OUTPUT"
          else
            echo "has27=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AppIntents schema validation skipped::Needs Xcode 27+, runner has ${MAJOR:-unknown}. The step auto-activates once a runner provides Xcode 27."
          fi

      - name: Show toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen (pinned)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o /tmp/xcodegen.zip
          echo "${XCODEGEN_SHA256}  /tmp/xcodegen.zip" | shasum -a 256 --check
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          test -x /tmp/xcodegen-dist/xcodegen/bin/xcodegen \
            || { echo "error: xcodegen binary not found at expected path after unzip — check zip layout" >&2; exit 1; }
          echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"

      # Regenerates Anglesite.xcodeproj (`xcodegen generate`) and runs the sync assertion — so
      # this step is also what produces the project the next two steps build.
      - name: Check Anglesite.xcodeproj ↔ project.yml sync (regenerates the project)
        run: scripts/check-xcodeproj-sync.sh

      - name: Build AnglesiteMobile (iOS Simulator)
        # Matches the invocation PR #886 verified manually ("BUILD SUCCEEDED") when the target
        # was first added; this lane is what makes that verification continuous. Ad-hoc Debug
        # signing (xcconfig/Signing-Debug.xcconfig) is already CI-safe — no extra
        # CODE_SIGNING_ALLOWED override needed.
        run: |
          xcodebuild -project Anglesite.xcodeproj -scheme AnglesiteMobile \
            -configuration Debug -destination 'generic/platform=iOS Simulator' build

      # The AppIntents metadata processor (`appintentsmetadataprocessor --validate-assistant-intents`)
      # only runs during an xcodebuild *build* phase — never `swift build` / `swift test`. So an
      # AppSchema conformance regression (e.g. SiteEntity dropping a required
      # `.wordProcessor.document` property) passes every SwiftPM lane and would surface only on a
      # contributor's local `xcodebuild`. Building just the `AnglesiteIntents` library target runs
      # the processor with `--validate-assistant-intents` to gate that; a missing required schema
      # member (verified locally) fails the build with a "Missing required property … from
      # AppSchemaEntity …" halting error. Validation is build-time, so it needs no app launch
      # (sidestepping the LaunchServices block on running a macOS-27 .app on an older host), no
      # vendored Node, no sibling plugin, and no signing.
      #
      # The AppSchema.WordProcessor surface and its validator are macOS-27 symbols, and the
      # hosted macos-26 image tops out at Xcode 26.x — so this step is ARMED but skips gracefully
      # (green, with the ::warning:: from the Xcode-selection step) until a runner provides
      # Xcode 27, then auto-activates and enforces with no edit needed.
      - name: Validate AppIntents schema conformance (Xcode 27+ only)
        if: steps.xcode.outputs.has27 == 'true'
        env:
          # Override the workflow-level skip: CLI xcodebuild (unlike GUI Xcode) passes this env
          # into Package.swift manifest evaluation, which would drop the AnglesiteContainer
          # product while the xcodegen-generated project still declares a dependency on it —
          # failing at project load.
          ANGLESITE_SKIP_CONTAINER: '0'
        run: xcodebuild -project Anglesite.xcodeproj -scheme AnglesiteIntents -configuration Debug build

  concurrency-tsan:
    name: Concurrency suites (ThreadSanitizer)
    # macos-26 for the same OS-runtime reason as build-test: this lane runs Swift concurrency
    # suites against the host's libswift_Concurrency, so it has the same exposure to the
    # macos-15 image's Swift 6.2.x task-allocator bug.
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    # The relay suites (TurnRelay/TextStreamRelay) and the ProcessSupervisor/InProcessBackend
    # suites have no plugin/Node dependency, so this lane skips the sibling-plugin checkout.
    # TSan deterministically flags data races the probabilistic `concurrentDeliver*` tests would
    # otherwise only catch by timing luck (#203), and gives the ProcessSupervisor suites (#856)
    # the same deterministic coverage.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest available Xcode
        # Same toolchain rationale as build-test: CLAUDE.md mandates Xcode 27+.
        id: xcode
        run: |
          set -euo pipefail
          # Skip Xcode 26.3 on the current runner image: its toolchain builds test targets that
          # link /usr/lib/swift/libswift_DarwinFoundation3.dylib, which the image does not ship, so
          # `swift test` fails to load AnglesitePackageTests.xctest ("Library not loaded"). Prefer the
          # newest *working* Xcode — 26.3 is excluded, so 27 is still auto-selected once it lands.
          # Remove the grep once the 26.3 image is repaired (or Xcode 27 is available).
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | grep -vE '/Xcode_26\.3(\.app|\.[0-9]+\.app)$' | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST"
          echo "version=$(basename "$LATEST")" >> "$GITHUB_OUTPUT"

      - name: Show toolchain versions
        run: swift --version

      # A distinct key namespace (`swiftpm-tsan-...`, not `swiftpm-macos-...`) — `--sanitize
      # thread` recompiles every unit with different flags, so sharing a cache with the plain
      # debug build would mean this lane can never hit and just pays the upload for nothing.
      # `v2`: see the linux-build-test cache step — stops restoring pre-repo-rename caches (and
      # for the restore-on-PR / save-on-main split).
      - name: Restore SwiftPM build cache (ThreadSanitizer)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-tsan-macos-v2-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-tsan-macos-v2-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved') }}-
            swiftpm-tsan-macos-v2-${{ steps.xcode.outputs.version }}-

      # tee + pipefail + annotate step: same compile-error-burying fix as build-test's
      # Test step (#1335) — this lane compiles the same AnglesiteCoreTests target and
      # failed identically there.
      - name: Run concurrency suites under ThreadSanitizer
        id: tsan
        run: |
          set -o pipefail
          scripts/test-concurrency-tsan.sh 2>&1 | tee "$RUNNER_TEMP/swift-tsan.log"

      - name: Surface Swift errors (annotations + job summary)
        if: failure() && steps.tsan.outcome == 'failure'
        run: scripts/annotate-swift-log.sh "$RUNNER_TEMP/swift-tsan.log" "Concurrency suites (ThreadSanitizer)"

      # #1745: build-test isn't the only lane that runs swift test — a suite whose leak only
      # shows up here (this lane runs a different, isolated target set under
      # --sanitize=thread) would otherwise go unchecked. Same belt-and-suspenders rationale as
      # build-test's own step (#1727): checked from a separate process on purpose, since the
      # in-suite assertions can't observe what cfprefsd does at process exit.
      - name: Check no test UserDefaults suites leaked
        run: scripts/check-test-userdefaults-leak.sh

      - name: Save SwiftPM build cache (ThreadSanitizer, main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

  localization-catalog:
    name: String Catalog checks (literal coverage + trailing newline)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # SWIFT_EMIT_LOC_STRINGS only performs the real String Catalog merge in an interactive
    # Xcode IDE build (#811) — a CLI-only `xcodebuild build`, the only option here, never
    # merges new/removed keys into Localizable.xcstrings. This lane is a static heuristic
    # substitute: it needs only python3, so it runs on ubuntu-latest with no Xcode/xcodegen.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-localization-catalog.sh
      # scripts/git-hooks/pre-commit restores the trailing newline Xcode strips, but it's a
      # local hook — absent in any clone that skipped setup-dev-env.sh, and already bypassed
      # more than once (#970). Enforce it here so the last byte stops flip-flopping.
      - run: scripts/check-xcstrings-newline.sh

  test-userdefaults-suite-lint:
    name: Tests lint (no direct UserDefaults(suiteName:) literals)
    # Static grep over Tests/*.swift — no Xcode/xcodegen needed, so ubuntu-latest suffices.
    # Catches the #1727 bypass at review time, before any test runs; the separate
    # check-test-userdefaults-leak.sh step in build-test/concurrency-tsan
    # catches the leak itself, after the fact, from a process that already ran (#1745).
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-test-userdefaults-suite-literal.sh

  reuse-lint:
    name: REUSE licensing lint
    # Deliberately NOT gated on the `changes` path filter: REUSE compliance is a whole-tree
    # property — a newly added file in any path group can lack licensing coverage — and the
    # lint costs seconds on ubuntu-latest, so path-gating would trade correctness for nothing.
    # No fsfe/reuse-action here for the same reason dorny/paths-filter was replaced above:
    # the org's Actions policy only allows GitHub-owned/Verified-Creator actions. pipx is
    # preinstalled on the ubuntu runner images.
    #
    # Same ARMED-but-skips-gracefully idiom as build-test's AnglesiteAppCore DocC step and
    # ios-build's AppIntents schema step: green with a ::warning:: until #1467 lands
    # REUSE.toml + LICENSES/, then it auto-activates and enforces with no edit here — #1467's
    # own PR is the first this lane lint-checks for real.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Pinned so a new reuse release can't silently change what this lane accepts (lint
      # checks tighten across releases). Bump deliberately. The charset-normalizer extra is
      # load-bearing, not optional: reuse 6.x hard-errors at import (NoEncodingModuleError)
      # without an encoding-detection backend, and the extra is the one that needs no
      # system libmagic — verified locally against 6.2.0 on both a compliant fixture
      # (exit 0) and a non-compliant tree (exit 1).
      REUSE_SPEC: reuse[charset-normalizer]==6.2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run reuse lint
        run: |
          set -euo pipefail
          if [ ! -f REUSE.toml ]; then
            echo "::warning title=REUSE lint skipped::REUSE.toml not present yet (#1467). Lane auto-activates once the REUSE metadata lands."
            echo "SKIPPED: REUSE.toml is absent (the #1467 groundwork hasn't merged), so there is no declared licensing metadata to lint yet."
            exit 0
          fi
          pipx run --spec "$REUSE_SPEC" reuse lint

  ci:
    name: CI required checks
    # Every job above is conditionally skipped by the `changes` path filter, so no single
    # existing job name is a reliable "did CI actually run" signal — a future branch-protection
    # rule should require this one instead. `always()` so it still runs (and can still fail)
    # when an upstream job was skipped or failed, rather than being skipped itself.
    if: always()
    needs:
      - changes
      - edit-overlay
      - wysiwyg-engine
      - safari-extension
      - help-book-links
      - docs-index
      - workers-tests
      - linux-build-test
      - linux-flatpak-build
      - build-test
      - ios-build
      - concurrency-tsan
      - localization-catalog
      - test-userdefaults-suite-lint
      - reuse-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify path detection succeeded and no required job failed
        # `needs.changes.result != 'success'` catches the case this job exists for: if `changes`
        # itself errors (flaky API call, upstream Action regression), every other job's `if:`
        # condition reads an empty output and quietly resolves to "skipped" rather than
        # "failed" — this job is `always()`, so it still runs and turns that into a loud
        # failure instead of a workflow that looks CI-clean with zero tests actually run.
        # `contains(needs.*.result, 'failure')` catches ordinary job failures too, so this one
        # job is a complete required-check signal on its own.
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure')
        run: |
          echo "::error::One or more required jobs did not succeed, or path detection itself failed (which silently skips everything downstream instead of failing it)."
          exit 1
