name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, not the weekly cadence of the default setup this replaced: since #1865 the
    # Swift analysis runs ONLY from this schedule (and workflow_dispatch) — see the
    # analyze-swift job — so this is its whole coverage cadence, not a backstop.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default setup's `javascript` and `javascript-typescript` entries are the same
          # extractor under two names (recent CodeQL merged the JS/TS analyzers) — one
          # matrix entry covers both. Actions workflow YAML has no build step to speed up;
          # it's here for parity with the language list default setup was scanning.
          - language: actions
          - language: javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'

  analyze-swift:
    name: Analyze (swift)
    # Schedule/workflow_dispatch only, never on PRs or main pushes (#1865). This was the single
    # most expensive job in the repo — 30-41 minutes on macos-26 with no cache (by design: CodeQL
    # has to observe the compile, see the build step) — and it competed for the same
    # 5-concurrent macOS runner slots as ci.yml's lanes, so every Swift PR queued an extra
    # hour-plus of macOS time behind it (measured queue waits of 98-180 minutes for this job
    # alone). It bought nothing on main either: with merges landing minutes apart,
    # `cancel-in-progress` cancelled 8 of the last 10 main runs before analysis finished. It is
    # not a required check (the `Main` ruleset requires only ci.yml's "CI required checks"). A
    # nightly run analyses main's tip reliably instead — scheduled workflows run against the
    # default branch — and the ubuntu JS/TS and Actions analyses above are cheap (~1 minute)
    # and stay on every PR and push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    runs-on: macos-26
    # Swift's portable-target build + CodeQL analysis has been landing at 42-46 minutes as the
    # portable targets grow, so 45 was too tight — three consecutive runs on #1680 timed out
    # mid-"Perform CodeQL Analysis" at 45m18s-45m43s (#1710). 60 gives real headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest available Xcode
        # Same toolchain selection as ci.yml's build-test job — see the comment there for why
        # Xcode 26.3 is excluded and macos-26 is required (Swift 6.2.x task-allocator bug).
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | grep -vE '/Xcode_26\.3(\.app|\.[0-9]+\.app)$' | tail -1)
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST"

      # Swift needs an actual compile to build the CodeQL database. `build-mode: manual` replaces
      # autobuild's build-strategy guessing with the SwiftPM portable-target build ci.yml's
      # build-test lane already completes reliably (#1052) — see the build step for what that
      # covers and deliberately excludes.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual

      - name: Build (SwiftPM portable targets, deliberately no cache)
        # SwiftPM build with ANGLESITE_SKIP_CONTAINER=1, mirroring ci.yml's build-test lane —
        # NOT the full `xcodebuild -scheme Anglesite` app build this job originally ran (#1031).
        # That build cannot skip the apple/containerization dependency graph (project.yml
        # references the AnglesiteContainer product unconditionally), and CodeQL's Swift
        # extractor traces it through Rosetta (all-x86_64 compiles on the arm64 runner), so it
        # blew past the 30-minute cap mid-BoringSSL on every run (#1052). This covers the
        # portable first-party targets (AnglesiteSiteModel/Core/Bridge/Intents and friends);
        # the thin SwiftUI app shell (Sources/AnglesiteApp) and AnglesiteContainer are NOT
        # analyzed — revisit if an app-build CI lane ever lands (#69 Task 8).
        #
        # No DerivedData/SwiftPM cache here on purpose: CodeQL's Swift extractor only sees
        # source files that actually get *compiled* during this step. An incremental build
        # restored from cache can skip recompiling unchanged files, so they'd silently drop
        # out of the CodeQL database (under-analysis, not a build failure) instead of
        # producing a stale-but-complete scan. ci.yml's own SwiftPM cache is for its
        # build/test lanes, not this one — don't copy it here without checking that tradeoff.
        env:
          ANGLESITE_SKIP_CONTAINER: '1'
        run: swift build --package-path .

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:swift'
