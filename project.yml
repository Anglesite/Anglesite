name: Anglesite
options:
  bundleIdPrefix: io.dwk.anglesite
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  Anglesite:
    path: .
  # Component Editor slice 4 (spec §7): STTextView code panes with tree-sitter syntax
  # highlighting — see the matching dependencies in Package.swift for the full rationale.
  STTextView:
    url: https://github.com/krzyzanowskim/STTextView
    from: 2.3.10
  # Pinned to a commit (tag 0.8.1), not `from:` — see the matching Package.swift comment: its
  # own manifest depends on Neon by `revision:`, and SwiftPM refuses a stable-version
  # requirement on a package that itself depends on an unstable-version one.
  STTextViewPluginNeon:
    url: https://github.com/krzyzanowskim/STTextView-Plugin-Neon
    revision: 5a30db4ce7908a5414e7b499e2379bdc49991cd1
  # Markdown editor substrate (#797): Anglesite's patched fork of
  # nodes-app/swift-markdown-engine, pinned by revision — see the matching
  # Package.swift comment for the full rationale.
  MarkdownEngine:
    url: https://github.com/Anglesite/swift-markdown-engine
    revision: badbaa4b9816daf3baa82de625c2551c4e0b4d81

targets:
  Anglesite:
    type: application
    platform: macOS
    sources:
      - path: Sources/AnglesiteApp
      - path: Resources/Assets.xcassets
      - path: Resources/Anglesite.sdef
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Template
        type: folder
        buildPhase: resources
      - path: Resources/Attributions
        type: folder
        buildPhase: resources
      - path: Resources/edit-overlay
        type: folder
        buildPhase: resources
        optional: true
      - path: Resources/wysiwyg-engine
        type: folder
        buildPhase: resources
        optional: true
      - path: Resources/ImportEngine
        type: folder
        buildPhase: resources
        optional: true
      - path: Resources/Anglesite.help
        type: folder
        buildPhase: resources
        optional: true
    preBuildScripts:
      # Regenerate the gitignored .xcodeproj from project.yml/Sources before anything
      # else, so a checkout that advanced without tripping scripts/git-hooks (e.g. synced
      # via fetch+reset instead of `git checkout`/`merge`/`rebase`) doesn't silently build
      # a stale project and fail with a confusing `cannot find 'X' in scope` (#123).
      # xcodegen generate is idempotent and ~1-2s. Caveat: Xcode has already resolved this
      # invocation's Compile Sources list before this phase runs, so a project that just
      # went stale still fails *this* build — but the rewritten pbxproj makes the very next
      # build succeed without anyone having to remember to run `xcodegen generate` by hand.
      # scripts/build-app.sh covers the CLI/agent case fully (regenerates before invoking
      # xcodebuild at all); this phase is the equivalent backstop for ⌘B in Xcode.
      # Best-effort like the other pre-build scripts below: warn and continue rather than
      # fail the build if xcodegen isn't installed.
      - name: Regenerate Xcode project
        script: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate --quiet
          else
            echo "warning: xcodegen not found on PATH — skipping project regeneration (brew install xcodegen)." >&2
          fi
        basedOnDependencyAnalysis: false
      # Guard first (among the rest) so a Release build with unvendored container
      # resources fails before the remaining (slower) build phases run. Debug only warns.
      - name: Check container resources
        script: "\"${PROJECT_DIR}/scripts/check-container-resources.sh\""
        basedOnDependencyAnalysis: false
      - name: Build edit overlay
        script: "\"${PROJECT_DIR}/scripts/build-overlay.sh\""
        basedOnDependencyAnalysis: false
      - name: Build WYSIWYG engine
        script: "\"${PROJECT_DIR}/scripts/build-wysiwyg-engine.sh\""
        basedOnDependencyAnalysis: false
      - name: Build import engine
        script: "\"${PROJECT_DIR}/scripts/build-import-engine.sh\""
        basedOnDependencyAnalysis: false
      - name: Build Help index
        script: "\"${PROJECT_DIR}/scripts/build-help-index.sh\""
        basedOnDependencyAnalysis: false
    # Debug/Release signing (CODE_SIGN_STYLE/IDENTITY/TEAM) comes from
    # xcconfig/Signing-{Debug,Release}.xcconfig instead of inline settings below, so a
    # personal Team set via Xcode's Signing & Capabilities tab can persist across
    # `xcodegen generate` — see those files for how to override locally without editing
    # this tracked config. The Debug file also carries ANGLESITE_DEBUG_ENTITLEMENTS
    # (#1038), which CODE_SIGN_ENTITLEMENTS below reads.
    configFiles:
      Debug: xcconfig/Signing-Debug.xcconfig
      Release: xcconfig/Signing-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dwk.anglesite
        PRODUCT_NAME: Anglesite
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Release keeps the clean MAS entitlements; Debug adds a temporary-exception
        # mach-lookup workaround for #775 (see Resources/Anglesite-Debug.entitlements).
        CODE_SIGN_ENTITLEMENTS: Resources/Anglesite.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        # String Catalog scaffolding (#528): the compiler extracts SwiftUI/String(localized:)
        # literals into Sources/AnglesiteApp/Localizable.xcstrings during Xcode builds.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_VERSION: "5.10"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ANGLESITE_MAS"
        # #541: weak-link FoundationModels so a beta Xcode SDK ahead of the installed macOS beta
        # seed (a symbol the SDK added but the OS doesn't export yet) can't abort dyld at launch.
        # #1495 adds the _CoreSpotlight_FoundationModels cross-import overlay (see Package.swift's
        # disableFoundationModelsAutolink) — its hard autolink hint is suppressed in AnglesiteCore,
        # so this app link (which pulls FoundationModelAssistant.o and with it the overlay's
        # SpotlightSearchTool symbols) must request the framework explicitly, weak for the same
        # SDK-ahead-of-OS reason as FoundationModels itself.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels -weak_framework _CoreSpotlight_FoundationModels"
      configs:
        Debug:
          # #775 workaround: punch the com.apple.NetworkSharing mach look-up back
          # through the sandbox so container boots survive macOS 27 seeds
          # 26A5378n–26A5388g. Debug-only — never ships to MAS.
          # Indirected through an xcconfig variable (#1038, defaults to
          # Resources/Anglesite-Debug.entitlements) rather than a literal path here, so
          # xcconfig/Signing-Debug.local.xcconfig can opt a real-Team local build into
          # Resources/Anglesite-Debug-iCloud.entitlements without editing this tracked file.
          CODE_SIGN_ENTITLEMENTS: $(ANGLESITE_DEBUG_ENTITLEMENTS)
    dependencies:
      - package: Anglesite
        product: AnglesiteCore
      - package: Anglesite
        product: AnglesiteBridge
      - package: Anglesite
        product: AnglesiteIntents
      - package: Anglesite
        product: AnglesiteContainer
      # Reuses MicropubOnboardingModel's IndieAuth onboarding flow for the Mac's CMS-mode
      # connect sheet (#800) — the same platform-neutral model AnglesiteMobile already
      # drives, with SiteMicropubSignIn as the AppKit ASWebAuthenticationSession adapter.
      - package: Anglesite
        product: AnglesiteIOS
      - package: STTextView
        product: STTextView
      - package: STTextViewPluginNeon
        product: STTextView-Plugin-Neon
      - package: MarkdownEngine
        product: MarkdownEngine
      - target: AnglesiteQuickLookPreview
        embed: true
      - target: AnglesiteQuickLookThumbnail
        embed: true
      - target: AnglesiteShareExtension
        embed: true
      - target: AnglesiteSafariExtension
        embed: true
      - target: AnglesiteRemote
        embed: true
        codeSign: true
        # `copy:` (not `buildPhase:` — that key only applies to `sources:` entries) is
        # XcodeGen's Dependency-level custom embed destination: without it, `embed: true`
        # defaults an application-type dependency to a bare Resources copy, not
        # Contents/Library/LoginItems (SMAppService.agent's documented discovery location).
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems

  # iOS thin client (#71): remote-only shell over RemoteSandboxSiteRuntime. Links only the
  # shared pieces it can use (Core's HTTP MCP client + sandbox control, the Bridge boundary,
  # and the AnglesiteIOS WKWebView wrapper) — never AnglesiteContainer or the editor packages.
  AnglesiteMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/AnglesiteMobile
      # Shared with the Anglesite/Mac target (#1434): the declared required-reason API
      # categories (UserDefaults, file timestamps, system boot time) come from AnglesiteCore
      # code both targets link, so one manifest covers both. Re-audit when P2P/QR-pairing
      # code (#1431, #1208 P2) adds categories the Mac target doesn't use.
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/edit-overlay
        type: folder
        buildPhase: resources
        optional: true
      - path: Resources/wysiwyg-engine
        type: folder
        buildPhase: resources
        optional: true
    preBuildScripts:
      # See the Anglesite target's matching comment above (#123) — same backstop, this
      # target just doesn't need the container-resources/help-index phases that follow it there.
      - name: Regenerate Xcode project
        script: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate --quiet
          else
            echo "warning: xcodegen not found on PATH — skipping project regeneration (brew install xcodegen)." >&2
          fi
        basedOnDependencyAnalysis: false
      - name: Build edit overlay
        script: "\"${PROJECT_DIR}/scripts/build-overlay.sh\""
        basedOnDependencyAnalysis: false
      - name: Build WYSIWYG engine
        script: "\"${PROJECT_DIR}/scripts/build-wysiwyg-engine.sh\""
        basedOnDependencyAnalysis: false
      - name: Build import engine
        script: "\"${PROJECT_DIR}/scripts/build-import-engine.sh\""
        basedOnDependencyAnalysis: false
    # See the Anglesite target's matching comment on configFiles above.
    configFiles:
      Debug: xcconfig/Signing-Debug.xcconfig
      Release: xcconfig/Signing-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dwk.anglesite.ios
        PRODUCT_NAME: Anglesite
        INFOPLIST_FILE: Resources/Info-iOS.plist
        GENERATE_INFOPLIST_FILE: NO
        # Release keeps the clean iCloud entitlements; Debug overrides to the no-iCloud file by
        # default (#866, mirrors the Anglesite/Mac target's CODE_SIGN_ENTITLEMENTS below).
        CODE_SIGN_ENTITLEMENTS: Resources/AnglesiteMobile.entitlements
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # String Catalog scaffolding, mirroring the macOS target (#528): Xcode IDE builds merge
        # extracted literals into Sources/AnglesiteMobile/Localizable.xcstrings; CLI builds need
        # the manual `xcstringstool sync` recipe from CONTRIBUTING.md.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_VERSION: "5.10"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        # #1495: this target links AnglesiteCore (FoundationModelAssistant.swift) but, unlike the
        # Anglesite/Mac target, never got #541's weak-link — confirmed hard-linking FoundationModels
        # via otool -l on a built product. Same SDK-ahead-of-installed-OS-seed risk during the
        # Xcode 27 / iOS 27 beta cycle. _CoreSpotlight_FoundationModels isn't observed linked here
        # (the SpotlightSearchTool call site appears macOS-gated), so it's omitted rather than
        # weak-linking a framework this target doesn't reference.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(ANGLESITE_MOBILE_DEBUG_ENTITLEMENTS)
    dependencies:
      - package: Anglesite
        product: AnglesiteCore
      - package: Anglesite
        product: AnglesiteBridge
      - package: Anglesite
        product: AnglesiteIntents
      - package: Anglesite
        product: AnglesiteIOS

  AnglesiteQuickLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/AnglesiteQuickLookPreview
    # See the Anglesite target's matching comment on configFiles above. Extensions embedded
    # in the host app need matching signing style/team for automatic signing to resolve.
    configFiles:
      Debug: xcconfig/Signing-Debug.xcconfig
      Release: xcconfig/Signing-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dwk.anglesite.QuickLookPreview
        PRODUCT_NAME: AnglesiteQuickLookPreview
        INFOPLIST_FILE: Resources/QuickLookPreview/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/QuickLookPreview/AnglesiteQuickLookPreview.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "5.10"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        SKIP_INSTALL: YES
    dependencies:
      - package: Anglesite
        product: AnglesiteQuickLookSupport

  AnglesiteQuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/AnglesiteQuickLookThumbnail
    # See the Anglesite target's matching comment on configFiles above. Extensions embedded
    # in the host app need matching signing style/team for automatic signing to resolve.
    configFiles:
      Debug: xcconfig/Signing-Debug.xcconfig
      Release: xcconfig/Signing-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dwk.anglesite.QuickLookThumbnail
        PRODUCT_NAME: AnglesiteQuickLookThumbnail
        INFOPLIST_FILE: Resources/QuickLookThumbnail/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/QuickLookThumbnail/AnglesiteQuickLookThumbnail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "5.10"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        SKIP_INSTALL: YES
    dependencies:
      - package: Anglesite
        product: AnglesiteQuickLookSupport

  # Safari share extension (#1450, spec: docs/superpowers/plans/2026-08-16-share-extension-quick-capture-plan.md):
  # posts the current Safari page as a link post without the app frontmost. See
  # AnglesiteCore/ShareExtension/ for the App-Group bookmark-sharing design.
  AnglesiteShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/AnglesiteShareExtension
    # See the Anglesite target's matching comment on configFiles above. Extensions embedded in
    # the host app need matching signing style/team for automatic signing to resolve.
    configFiles:
      Debug: xcconfig/Signing-Debug.xcconfig
      Release: xcconfig/Signing-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dwk.anglesite.ShareExtension
        PRODUCT_NAME: AnglesiteShareExtension
        INFOPLIST_FILE: Resources/ShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/ShareExtension/AnglesiteShareExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "5.10"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        SKIP_INSTALL: YES
        # Matches AnglesiteRemote: the extension only ever runs embedded in the MAS-distributed
        # host app, so its Core-layer bookmark-resolution code should take the ANGLESITE_MAS
        # branch, not the DevID/test fallback.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ANGLESITE_MAS"
        # #1495: this target links AnglesiteCore (FoundationModelAssistant.swift) the same way the
        # Anglesite/AnglesiteRemote targets above do, and hits the identical hard-link — confirmed
        # via a failed Debug link ("symbol(s) not found for architecture arm64" across both
        # FoundationModels and the _CoreSpotlight_FoundationModels overlay). Same SDK-ahead-of-
        # installed-OS-seed risk during the Xcode 27 beta cycle. Mirrors AnglesiteRemote's matching
        # OTHER_LDFLAGS above.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels -weak_framework _CoreSpotlight_FoundationModels"
      configs:
        Debug:
          # See the AnglesiteRemote target's matching comment on this indirection pattern.
          CODE_SIGN_ENTITLEMENTS: $(ANGLESITE_SHARE_EXTENSION_DEBUG_ENTITLEMENTS)
    dependencies:
      - package: Anglesite
        product: AnglesiteCore

  # IndieWeb Safari Extension (#1098): standalone Manifest V3 Safari Web Extension embedded in
  # Anglesite.app. Detects h-cards, feeds, webmentions, ActivityPub, and general microformats2 on
  # the page the user is viewing in Safari. No native messaging, no dependency on a running
  # Anglesite.app — all detection/UI logic is the JS/safari-extension bundle built into
  # Resources/SafariExtension/ by scripts/build-safari-extension.sh. Spec:
  # docs/superpowers/specs/2026-08-17-safari-indieweb-extension-design.md.
  AnglesiteSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/AnglesiteSafariExtension
      - path: Resources/SafariExtension/manifest.json
      - path: Resources/SafariExtension/popup.html
      - path: Resources/SafariExtension/popup.css
      - path: Resources/SafariExtension/content-script.js
        optional: true
      - path: Resources/SafariExtension/background.js
        optional: true
      - path: Resources/SafariExtension/popup.js
        optional: true
      - path: Resources/SafariExtension/images
        type: folder
        buildPhase: resources
    # See the Anglesite target's matching comment on configFiles above. Extensions embedded in
    # the host app need matching signing style/team for automatic signing to resolve.
    configFiles:
      Debug: xcconfig/Signing-Debug.xcconfig
      Release: xcconfig/Signing-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dwk.anglesite.SafariExtension
        PRODUCT_NAME: AnglesiteSafariExtension
        INFOPLIST_FILE: Resources/SafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/SafariExtension/AnglesiteSafariExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "5.10"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ANGLESITE_MAS"
    preBuildScripts:
      # Same backstop as the Anglesite target's matching phase (#123) — a stale gitignored
      # xcodeproj must regenerate before this target's own build can trust its file list.
      - name: Regenerate Xcode project
        script: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen generate --quiet
          else
            echo "warning: xcodegen not found on PATH — skipping project regeneration (brew install xcodegen)." >&2
          fi
        basedOnDependencyAnalysis: false
      - name: Build Safari extension
        script: "\"${PROJECT_DIR}/scripts/build-safari-extension.sh\""
        basedOnDependencyAnalysis: false

  # Anywhere runtime (#1208 P1): faceless helper, login item via SMAppService.agent, embedded
  # inside Anglesite.app so one install covers both. No Dock icon, no windows (LSUIElement).
  #
  # sources: only the thin executable (Sources/anglesite-remote-helper) — the app target's own
  # module name is derived from PRODUCT_NAME ("Anglesite Remote" -> "Anglesite_Remote"), a
  # *different* module from the "AnglesiteRemote" library main.swift imports. So the reusable
  # implementation (Sources/AnglesiteRemote) is linked as a real SwiftPM library product (see
  # `dependencies:` below + Package.swift's matching product), not compiled directly into this
  # target's own sources — mirroring how the Anglesite target links AnglesiteCore/etc. as
  # packages rather than inlining their source directories.
  AnglesiteRemote:
    type: application
    platform: macOS
    sources:
      - path: Sources/anglesite-remote-helper
      # Filename must match LoginItemRegistering.swift's SMAppServiceLoginItem default
      # `plistName` ("io.dwk.anglesite.remote.plist") — SMAppService.agent(plistName:) looks up
      # this exact filename under the bundle's Contents/Library/LaunchAgents/, and XcodeGen's
      # copy phase preserves the source file's basename (no rename-on-copy).
      - path: Resources/io.dwk.anglesite.remote.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    # See the Anglesite target's matching comment on configFiles above. Embedded targets need
    # matching signing style/team for automatic signing to resolve.
    configFiles:
      Debug: xcconfig/Signing-Debug.xcconfig
      Release: xcconfig/Signing-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dwk.anglesite.remote
        PRODUCT_NAME: "Anglesite Remote"
        INFOPLIST_FILE: Resources/AnglesiteRemote-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Release keeps the entitlements carrying the shared keychain access group (#1208 P2);
        # Debug overrides to the no-keychain-group file below by default. Mirrors the
        # Anglesite/AnglesiteMobile targets above — see their matching comments.
        CODE_SIGN_ENTITLEMENTS: Resources/AnglesiteRemote.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "5.10"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ANGLESITE_MAS"
        SKIP_INSTALL: YES
        # Embedded helper apps live under the parent's Contents/Library/LoginItems/ —
        # SMAppService.agent's documented discovery location.
        # #1495: this target links AnglesiteCore (FoundationModelAssistant.swift) the same way the
        # Anglesite/Mac target above does, but never got #541's weak-link — confirmed hard-linking
        # both FoundationModels and the _CoreSpotlight_FoundationModels overlay via otool -l on a
        # built product. Since this is an SMAppService.agent login item that can run with the main
        # app window closed, a dyld abort here is a silent background-process death, not even a
        # visible crash dialog. Mirrors the Anglesite target's matching OTHER_LDFLAGS above.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels -weak_framework _CoreSpotlight_FoundationModels"
      configs:
        Debug:
          # #1208 P2: keychain-access-groups requires a real provisioning profile even under
          # ad-hoc/Manual signing, so the default Debug build must sign against a file without
          # it or Xcode fails with '"AnglesiteRemote" requires a provisioning profile'.
          # Indirected through an xcconfig variable (defaults to
          # Resources/AnglesiteRemote-Debug.entitlements) rather than a literal path here, so
          # xcconfig/Signing-Debug.local.xcconfig can opt a real-Team local build into
          # Resources/AnglesiteRemote-Debug-Keychain.entitlements without editing this tracked
          # file — exactly how ANGLESITE_DEBUG_ENTITLEMENTS works for the Anglesite target.
          CODE_SIGN_ENTITLEMENTS: $(ANGLESITE_REMOTE_DEBUG_ENTITLEMENTS)
    dependencies:
      - package: Anglesite
        product: AnglesiteRemote
      - package: Anglesite
        product: AnglesiteCore
      - package: Anglesite
        product: AnglesiteContainer
      - package: Anglesite
        product: AnglesiteP2P

schemes:
  Anglesite:
    build:
      targets:
        Anglesite: all
    run:
      config: Debug
    archive:
      config: Release
  AnglesiteMobile:
    build:
      targets:
        AnglesiteMobile: all
    run:
      config: Debug
    archive:
      config: Release
