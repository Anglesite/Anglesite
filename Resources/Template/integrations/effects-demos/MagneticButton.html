<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Magnetic Button</title>
<style>body{margin:0;position:relative;min-height:100vh;display:grid;place-items:center;
font-family:-apple-system,system-ui,sans-serif;background:Canvas;color:CanvasText;color-scheme:light dark}</style>
<style>
  .magnetic-button {
    display: inline-block;
    padding: 0.75em 1.5em;
    border-radius: 999px;
    background: color-mix(in srgb, currentColor 10%, transparent);
    border: 1px solid currentColor;
    font: inherit;
    cursor: pointer;
    transition: transform 0.15s ease-out;
    text-decoration: none;
    color: inherit;
  }
</style>
</head><body>
<button class="magnetic-button" data-astro-cid-jupilzmv="true">Get in touch</button>
<script>const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
if (!reduceMotion && canHover) {
    document.querySelectorAll(".magnetic-button").forEach((el) => {
        const radius = 60;
        el.addEventListener("pointermove", (ev) => {
            const rect = el.getBoundingClientRect();
            const dx = ev.clientX - (rect.left + rect.width / 2);
            const dy = ev.clientY - (rect.top + rect.height / 2);
            const distance = Math.hypot(dx, dy);
            if (distance < radius) {
                el.style.transform = `translate(${dx * 0.3}px, ${dy * 0.3}px)`;
            }
        });
        el.addEventListener("pointerleave", () => {
            el.style.transform = "translate(0, 0)";
        });
    });
}
</script>
</body></html>
