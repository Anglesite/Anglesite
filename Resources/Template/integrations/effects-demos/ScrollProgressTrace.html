<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Scroll Progress Trace</title>
<style>body{margin:0;position:relative;min-height:100vh;display:grid;place-items:center;
font-family:-apple-system,system-ui,sans-serif;background:Canvas;color:CanvasText;color-scheme:light dark}</style>
<style>
  .scroll-progress-trace {
    position: fixed;
    right: 12px;
    top: 0;
    width: 6px;
    height: 100vh;
    pointer-events: none;
    z-index: 2147483646;
  }
  .scroll-progress-trace canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head><body>
<div class="scroll-progress-trace" data-color="currentColor" data-astro-cid-acaett2g><canvas data-astro-cid-acaett2g></canvas></div>
<script>class ScrollProgressTrace {
    constructor(root) {
        const canvas = root.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        if (!ctx)
            return;
        const color = root.dataset.color ?? "currentColor";
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        function resize() {
            canvas.width = root.clientWidth;
            canvas.height = root.clientHeight;
        }
        function draw() {
            if (!ctx)
                return;
            const doc = document.documentElement;
            const max = doc.scrollHeight - doc.clientHeight;
            const progress = max > 0 ? Math.min(1, scrollY / max) : 0;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height * progress);
            ctx.stroke();
        }
        resize();
        draw();
        if (!reduceMotion) {
            addEventListener("resize", () => { resize(); draw(); }, { passive: true });
            let listening = false;
            const observer = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting && !listening) {
                        listening = true;
                        addEventListener("scroll", draw, { passive: true });
                        draw();
                    }
                    else if (!entry.isIntersecting && listening) {
                        listening = false;
                        removeEventListener("scroll", draw);
                    }
                }
            });
            observer.observe(root);
        }
    }
}
document.querySelectorAll(".scroll-progress-trace").forEach((el) => new ScrollProgressTrace(el));
</script>
</body></html>
