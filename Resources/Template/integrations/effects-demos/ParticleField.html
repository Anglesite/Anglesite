<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Particle Field</title>
<style>body{margin:0;position:relative;min-height:100vh;display:grid;place-items:center;
font-family:-apple-system,system-ui,sans-serif;background:Canvas;color:CanvasText;color-scheme:light dark}</style>
<style>
  .particle-field-root {
    position: absolute;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .particle-field-root canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head><body>
<div class="particle-field-root" data-density="60" data-color="#7c3aed" data-astro-cid-ahf5wtdh><canvas data-astro-cid-ahf5wtdh></canvas></div>
<script>class ParticleField {
    constructor(root) {
        const canvas = root.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        if (!ctx)
            return;
        const density = Number(root.dataset.density ?? 60);
        const color = root.dataset.color ?? "currentColor";
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let particles = [];
        let raf = 0;
        let running = false;
        function resize() {
            canvas.width = root.clientWidth;
            canvas.height = root.clientHeight;
            particles = Array.from({ length: density }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.3,
                vy: (Math.random() - 0.5) * 0.3,
            }));
        }
        function drawStaticFrame() {
            resize();
            if (!ctx)
                return;
            ctx.fillStyle = color;
            for (const p of particles)
                ctx.fillRect(p.x, p.y, 1.5, 1.5);
        }
        function tick() {
            if (!running || !ctx)
                return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = color;
            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width)
                    p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height)
                    p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.15;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    if (dx * dx + dy * dy < 80 * 80) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            ctx.globalAlpha = 1;
            raf = requestAnimationFrame(tick);
        }
        if (reduceMotion) {
            drawStaticFrame();
        }
        else {
            const observer = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting && !running) {
                        running = true;
                        resize();
                        raf = requestAnimationFrame(tick);
                    }
                    else if (!entry.isIntersecting && running) {
                        running = false;
                        cancelAnimationFrame(raf);
                    }
                }
            });
            observer.observe(root);
            addEventListener("resize", resize, { passive: true });
        }
    }
}
document.querySelectorAll(".particle-field-root").forEach((el) => new ParticleField(el));
</script>
</body></html>
