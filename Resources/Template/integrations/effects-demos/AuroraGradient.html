<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aurora Gradient</title>
<style>body{margin:0;position:relative;min-height:100vh;display:grid;place-items:center;
font-family:-apple-system,system-ui,sans-serif;background:Canvas;color:CanvasText;color-scheme:light dark}</style>
<style>
  .aurora-gradient-root {
    position: absolute;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    filter: blur(40px);
  }
  .aurora-gradient-root canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head><body>
<div class="aurora-gradient-root" data-colors="#7c3aed,#2563eb,#0891b2" data-astro-cid-gj7fsof7><canvas data-astro-cid-gj7fsof7></canvas></div>
<script>class AuroraGradient {
    constructor(root) {
        const canvas = root.querySelector("canvas");
        const ctx = canvas.getContext("2d");
        if (!ctx)
            return;
        const colors = (root.dataset.colors ?? "").split(",").filter(Boolean);
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let raf = 0;
        let running = false;
        let t = 0;
        function resize() {
            canvas.width = root.clientWidth;
            canvas.height = root.clientHeight;
        }
        function paint(time) {
            if (!ctx)
                return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            colors.forEach((color, i) => {
                const angle = time + (i * Math.PI * 2) / colors.length;
                const x = canvas.width / 2 + Math.cos(angle) * canvas.width * 0.3;
                const y = canvas.height / 2 + Math.sin(angle) * canvas.height * 0.3;
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, Math.max(canvas.width, canvas.height) * 0.4);
                gradient.addColorStop(0, color);
                gradient.addColorStop(1, "transparent");
                ctx.fillStyle = gradient;
                ctx.globalAlpha = 0.5;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            });
            ctx.globalAlpha = 1;
        }
        function tick() {
            if (!running)
                return;
            t += 0.002;
            paint(t);
            raf = requestAnimationFrame(tick);
        }
        resize();
        if (reduceMotion) {
            paint(0);
        }
        else {
            const observer = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting && !running) {
                        running = true;
                        raf = requestAnimationFrame(tick);
                    }
                    else if (!entry.isIntersecting && running) {
                        running = false;
                        cancelAnimationFrame(raf);
                    }
                }
            });
            observer.observe(root);
            addEventListener("resize", resize, { passive: true });
        }
    }
}
document.querySelectorAll(".aurora-gradient-root").forEach((el) => new AuroraGradient(el));
</script>
</body></html>
